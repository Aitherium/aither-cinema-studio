[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aither-cinema-mcp"
version = "0.1.0"
description = "MCP server for Aither Cinema Studio: direct open-weights film shots from any agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.9,<2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
cinema-mcp = "cinema_mcp.server:main"

[tool.setuptools]
packages = ["cinema_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008", "UP006", "UP035", "UP007", "UP045"]
