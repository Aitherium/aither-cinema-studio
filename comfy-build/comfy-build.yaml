  # The ComfyUI-CinemaRig node pack ships in this repo at comfy_nodes/ComfyUI-CinemaRig.
  # A build can only pin a node pack that is reachable from the builder: a public
  # GitHub repository at a commit, a registry version, or an uploaded blob.  None
  # of those exist until the repo is published, so the list stays empty here.
  # A `repository` source clones the repo root, and this spec has no way to name a
  # subdirectory, so the pack must be published as its own repository (or as a
  # registry version).  Then add exactly this and re-validate — replace <org> and
  # the commit with the published values, never invent a sha:
  #
  # customNodes:
  #   - name: ComfyUI-CinemaRig
  #     repository: https://github.com/<org>/ComfyUI-CinemaRig
  #     gitRef: <40-hex commit>
  customNodes: []

