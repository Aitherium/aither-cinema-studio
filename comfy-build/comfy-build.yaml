# Comfy Cloud build so the studio can render without a local GPU.
#
#   comfy build validate comfy-build            # offline, free
#   comfy build validate comfy-build --remote   # + public model lookup, needs sign-in
#   comfy build push comfy-build --dry-run      # free, shows what would upload
#   comfy build push comfy-build                # SPENDS A BUILD SLOT — owner only
#   comfy build release create --target linux/nvidia --watch   # owner only
#
# Every model entry below was resolved with `comfy build refs resolve <filename>`
# and carries the sha256 that command reported (verified: true).  Do not hand-edit
# a digest; re-run the resolver.
